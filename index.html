<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050b07">
  <title>Tony Looks</title>
  <meta name="description" content="Manda sua foto e vira um Tony.">
  <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js" } }
  </script>
  <style>
    /* Tema escuro intencional. Raios: painéis 24px, campos 16px, botões pílula. */
    :root {
      --bg: #050b07;
      --text: #eef5ea;
      --muted: #a3b8a8;
      --accent: #c6f432;
      --on-accent: #0b1a06;
      --glass: rgba(10, 20, 13, 0.62);
      --line: rgba(238, 245, 234, 0.12);
      --error: #ff8a7a;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --dock-h: 190px;

      /* Grade: uma margem só; espaçamentos em múltiplos de 8 */
      --m: 16px;
      --bar: 24px;                                  /* altura da linha do topo */
      --display: 22vw; /* provisório; fitTitle ajusta para a palavra ocupar a largura exata */
      --top: calc(var(--m) + var(--bar) + 8px);     /* onde começa o "Tony" */
      /* Escala tipográfica */
      --fs-1: 13px;  /* contador, avisos */
      --fs-2: 15px;  /* marca, dica, sugestões, rótulos */
      --fs-3: 17px;  /* campo e botões */
      --fs-4: clamp(20px, 1.7vw, 24px);  /* subtítulo */
      --fs-k: clamp(32px, 8.4vw, 64px);  /* legenda */
    }
    @media (min-width: 900px) {
      :root {
        --m: clamp(32px, 4.4vw, 72px);
        --col: min(560px, 40vw);                    /* coluna de texto à esquerda */
      }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; overflow: hidden;
      background: radial-gradient(100% 70% at 50% 100%, #0d2414 0%, transparent 70%), var(--bg);
      color: var(--text);
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* Camadas: título "Tony" (1) < WebGL: fumaça + Tony + fumaça (2) < "Zator" translúcido (3) < legenda (4) < interface (5) */
    #gl { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 2; touch-action: none; cursor: grab; }
    #bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; } /* folhas, atrás do título */
    #gl.dragging { cursor: grabbing; }

    /* Títulos gigantes. O recuo em em compensa a folga lateral das letras (alinhamento óptico). */
    .t {
      position: fixed; margin: 0; pointer-events: none;
      font-size: var(--display); font-weight: 800; letter-spacing: -0.06em; line-height: .8;
    }
    /* "TonyZator" numa palavra, de margem a margem (tamanho e --ink-l calculados em fitTitle),
       inteira atrás do rosto do boneco. */
    .t { top: var(--top); left: calc(var(--m) - var(--ink-l, 0px)); white-space: nowrap; }
    .t .b { display: inline-block; color: var(--accent); }
    .t-back { z-index: 1; color: var(--text); }

    /* Linha do topo: só o botão de mandar o site no Zap, à direita */
    .share-site {
      position: fixed; z-index: 5; top: calc(var(--m) - 8px); right: var(--m); height: 40px; padding: 0 16px;
      display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; cursor: pointer;
      border: 1px solid var(--line); background: var(--glass); color: var(--text);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      font: inherit; font-size: var(--fs-2); font-weight: 700; line-height: 1;
      transition: background .2s var(--ease), transform .15s var(--ease), opacity 1.1s var(--ease);
    }
    .share-site .ic { color: var(--accent); }
    .ic { width: 22px; height: 22px; flex: none; }
    .share-site:hover { background: rgba(238, 245, 234, .1); }
    .share-site:active { transform: scale(.97); }

    /* Nada de seleção azul/cinza ao arrastar o dedo: só o campo de texto é selecionável */
    body { -webkit-user-select: none; user-select: none; }
    textarea { -webkit-user-select: text; user-select: text; }

    .lead {
      position: fixed; z-index: 5; left: var(--m); margin: 0;
      top: calc(var(--top) + var(--display) * .8 + 16px);
      font-size: var(--fs-4); font-weight: 500; line-height: 1.2; letter-spacing: -0.01em;
      text-shadow: 0 2px 18px rgba(0, 0, 0, .8);
    }


    /* ---------- Legenda karaokê ---------- */
    /* Legenda: mesma zona e mesmo alinhamento do "Zator" (embaixo, à direita) */
    .kara {
      position: fixed; z-index: 4; right: var(--m); bottom: calc(var(--dock-h) + var(--m));
      width: calc(100% - var(--m) * 2); margin: 0; text-align: right; pointer-events: none;
      font-size: var(--fs-k); font-weight: 800; letter-spacing: -0.035em; line-height: 1.05;
      text-shadow: 0 6px 40px rgba(0, 0, 0, .7);
    }
    @media (min-width: 900px) {
      .kara { bottom: var(--m); width: calc(100% - var(--col) - var(--m) * 3); }
    }
    .kara .w {
      display: inline-block; margin-left: .22em; opacity: 0; filter: blur(10px);
      transform: translateY(14px) scale(.94);
      transition: opacity .35s var(--ease), filter .35s var(--ease), transform .35s var(--ease), color .25s;
    }
    .kara .w.on { opacity: 1; filter: none; transform: none; }
    .kara .w.now { color: var(--accent); transform: scale(1.07); }
    .kara.leave .w { opacity: 0; filter: blur(14px); transform: translateY(-34px) scale(1.04); transition-duration: .7s; }

    /* ---------- Dock ---------- */
    .dock {
      position: fixed; z-index: 5; left: var(--m); bottom: max(var(--m), env(safe-area-inset-bottom));
      width: calc(100% - var(--m) * 2);
      background: var(--glass); border: 1px solid var(--line); border-radius: 24px; padding: 16px;
      backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%);
      box-shadow: inset 0 1px 0 rgba(238, 245, 234, .07), 0 30px 80px rgba(0, 0, 0, .5);
      transition: opacity .6s var(--ease), transform .6s var(--ease);
    }
    @media (prefers-reduced-transparency: reduce) {
      .dock { background: #0d1a12; backdrop-filter: none; -webkit-backdrop-filter: none; }
    }
    .dock[hidden] { display: none; }
    @media (min-width: 900px) { .dock { width: var(--col); } }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: none; border: 1px solid var(--line); background: transparent; color: var(--text);
      height: 36px; padding: 0 14px; border-radius: 999px; font: inherit; font-size: var(--fs-2); font-weight: 500; cursor: pointer;
      transition: background .2s var(--ease), border-color .2s var(--ease);
    }
    .chip:hover { background: rgba(238, 245, 234, .07); border-color: rgba(238, 245, 234, .22); }

    .dock label {
      display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 8px;
      font-size: var(--fs-2); font-weight: 700; line-height: 1.2;
    }
    .dock label span { font-size: var(--fs-1); font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
    .composer { display: flex; align-items: flex-end; gap: 8px; }
    textarea {
      flex: 1; min-height: 52px; max-height: 128px; resize: none; overflow-y: hidden;
      padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(3, 8, 5, .6);
      color: var(--text); font: inherit; font-size: var(--fs-3); line-height: 1.4;
      transition: border-color .2s var(--ease), box-shadow .2s var(--ease), color .5s;
    }
    textarea::placeholder { color: #7f9786; }
    textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(198, 244, 50, .14); }
    textarea.vapor { color: transparent; }
    .err { color: var(--error); font-size: var(--fs-1); margin: 8px 0 0; }
    .err:empty { display: none; }

    .send {
      flex: none; height: 52px; padding: 0 20px; border: 0; border-radius: 999px; cursor: pointer;
      background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 700; font-size: var(--fs-3);
      display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
      transition: transform .15s var(--ease), background .2s, opacity .2s;
    }
    .send .ic { width: 20px; height: 20px; }
    .send:hover { background: #d4ff4a; }
    .send:active { transform: scale(.96); }
    .send[disabled] { opacity: .6; cursor: progress; }

    .player { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto auto auto; align-items: center; gap: 8px; }
    .player .wave { margin: 0 8px; }
    .player .btn-icon { width: 44px; min-height: 44px; }
    .play {
      width: 52px; height: 52px; border-radius: 999px; border: 0; cursor: pointer;
      background: var(--text); color: var(--bg); display: grid; place-items: center; font-size: 20px;
    }
    .wave { display: flex; align-items: center; gap: 2px; height: 40px; min-width: 0; overflow: hidden; }
    .wave span { flex: 1; min-width: 1px; border-radius: 2px; background: rgba(238, 245, 234, .25); }
    .wave span.on { background: var(--accent); }
    .time { font-variant-numeric: tabular-nums; font-size: var(--fs-1); color: var(--muted); }
    .actions { display: grid; gap: 8px; margin-top: 16px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 20px;
      border-radius: 999px; border: 1px solid var(--line); cursor: pointer; font: inherit; font-weight: 700; font-size: var(--fs-3);
      background: rgba(238, 245, 234, .07); color: var(--text); white-space: nowrap;
      transition: transform .15s var(--ease), background .2s;
    }
    .btn .ic { width: 21px; height: 21px; }
    .play .ic { width: 20px; height: 20px; }
    .btn:active { transform: scale(.97); }
    .btn-zap { background: var(--accent); color: var(--on-accent); border: 0; }
    .btn-zap:hover { background: #d4ff4a; }
    .btn-icon { width: 52px; padding: 0; }
    @media (max-width: 420px) { .send .lbl { display: none; } .send { width: 52px; padding: 0; justify-content: center; } }

    /* ---------- Abertura ---------- */
    .intro .t, .intro .lead, .intro .share-site, .intro .dock { opacity: 0; }
    .intro .t { transform: translateY(30px); filter: blur(16px); }
    .intro .dock { transform: translateY(30px); }
    .t, .lead { transition: opacity 1.1s var(--ease), transform 1.1s var(--ease), filter 1.1s var(--ease); }
    .lead { transition-delay: .5s; }
    .skip {
      position: fixed; z-index: 6; bottom: calc(var(--dock-h) + 8px); left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 8px; white-space: nowrap;
      color: var(--muted); font-size: var(--fs-1); opacity: 0; transition: opacity .5s; pointer-events: none;
    }
    .skip strong { color: var(--accent); font-size: var(--fs-4); font-weight: 800; letter-spacing: -0.01em; text-shadow: 0 2px 18px rgba(0, 0, 0, .8); }
    .skip span { opacity: .7; transition: opacity .5s; }
    /* a frase fica um pouco além da abertura (intro-tail); o "toque para pular" some junto com ela */
    .intro .skip, .intro-tail .skip { opacity: 1; }
    body:not(.intro) .skip span { opacity: 0; }
    /* no computador fica embaixo do Tony (coluna da direita), longe da caixa de texto */
    @media (min-width: 900px) { .skip { left: 60%; bottom: var(--m); } }

    /* Dica "Dê remédio pro Tony": acompanha a cabeça; a ponta da seta (canto de baixo à esquerda) fica no rosto */
    .poke {
      position: fixed; z-index: 4; left: 0; top: 0; pointer-events: none;
      display: flex; flex-direction: column; align-items: flex-start;
      opacity: 0; transition: opacity .5s var(--ease);
    }
    .poke.show { opacity: 1; }
    .poke .tag {
      margin-left: 34px; padding: 10px 18px; border-radius: 999px; white-space: nowrap;
      background: var(--accent); color: var(--on-accent); font-weight: 800; font-size: var(--fs-3);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .5); transform: rotate(-4deg);
    }
    .poke svg { width: 46px; height: 46px; color: var(--accent); filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .6)); }
    .poke.show .tag, .poke.show svg { animation: poke 1.1s var(--ease) infinite alternate; }
    @keyframes poke { to { translate: -6px 6px; } }

    /* Baseado no lugar do cursor: a piteira (ponta esquerda) fica no ponteiro, a brasa na outra ponta */
    body.joint-on #gl { cursor: none; }
    .joint {
      position: fixed; z-index: 4; left: 0; top: 0; width: 92px; height: 18px; margin-top: -9px;
      pointer-events: none; transform-origin: 0 50%; opacity: 0; transition: opacity .2s;
      filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .55));
    }
    @media (max-width: 899px) { .joint { width: 74px; height: 15px; margin-top: -7.5px; } }
    .joint.show { opacity: 1; }
    .joint svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .joint .ember {
      position: absolute; right: -3px; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; border-radius: 50%;
      background: radial-gradient(circle, #fff2b0 0 25%, #ff8a1f 55%, #c43a00 100%);
      box-shadow: 0 0 10px 3px rgba(255, 120, 20, .55); transition: box-shadow .3s, transform .3s;
    }
    .joint.lit .ember { transform: scale(1.35); box-shadow: 0 0 22px 9px rgba(255, 140, 30, .85); }

    .toast {
      position: fixed; left: 50%; top: 18px; transform: translate(-50%, -20px); opacity: 0; z-index: 10;
      background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 999px;
      font-weight: 500; font-size: var(--fs-2); transition: opacity .3s var(--ease), transform .3s var(--ease);
      pointer-events: none; max-width: calc(100% - 32px); text-align: center;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }


    /* ---------- Tony Looks: envio e resultado da foto ---------- */
    .dock { max-height: calc(100dvh - var(--m) * 2); overflow-y: auto; }
    .dock label.pick {
      cursor: pointer; width: 100%; margin: 0; justify-content: center; align-items: center;
      font-size: var(--fs-3); font-weight: 700; color: var(--on-accent);
    }
    .dock label.pick span { font-size: inherit; font-weight: inherit; color: inherit; }
    #fileInput { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 0 12px; }
    .tab {
      height: 44px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted);
      font: inherit; font-weight: 700; font-size: var(--fs-2); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      transition: background .2s var(--ease), color .2s, border-color .2s;
    }
    .tab[aria-selected="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
    .stage {
      position: relative; display: grid; place-items: center; border-radius: 16px; overflow: hidden;
      background: rgba(3, 8, 5, .6); border: 1px solid var(--line); min-height: 160px;
    }
    .stage canvas, .stage img { display: block; max-width: 100%; max-height: 26vh; } /* celular: o rosto do Tony continua à mostra */
    @media (min-width: 900px) { .stage canvas, .stage img { max-height: 46vh; } }
    .panel { display: none; width: 100%; place-items: center; }
    .panel.show { display: grid; }
    .ai-empty { display: grid; gap: 12px; justify-items: center; text-align: center; padding: 20px 16px; color: var(--muted); font-size: var(--fs-2); }
    .ai-empty small { font-size: var(--fs-1); }
    .ai-status { color: var(--accent); font-weight: 700; font-size: var(--fs-2); }
    .ai-error { color: var(--error); font-size: var(--fs-2); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .row .wide { grid-column: 1 / -1; }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    [hidden] { display: none !important; }

    @media (prefers-reduced-motion: reduce) {
      .kara .w { transition: none; }
      .poke.show .tag, .poke.show svg { animation: none; }
    }
  </style>
</head>

  </svg>
  <h1 class="t t-back" id="title"><span class="a">Tony</span><span class="b">Looks</span></h1>
  <canvas id="bg" aria-hidden="true"></canvas>
  <canvas id="gl" aria-label="Tony, o boneco, no meio da fumaça. Toque nele ou mexa na fumaça." role="img"></canvas>

  <p class="lead">Manda sua foto e vira um Tony</p>
  <button class="share-site" id="share-top" type="button"><svg class="ic" aria-hidden="true"><use href="#i-zap"/></svg> Compartilhar no Zap</button>

  <p class="kara" id="kara" aria-live="polite"></p>

  <div class="poke" id="poke" aria-hidden="true">
    <span class="tag">Dê remédio pro Tony</span>
    <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M40 6c-4 18-14 28-30 32"/><path d="M8 26l2 12l12 0"/></svg>
  </div>

  <div class="joint" id="joint" aria-hidden="true">
    <svg viewBox="0 0 100 20" preserveAspectRatio="none">
      <path d="M0 6.6 L15 6.2 L15 13.8 L0 13.4 Z" fill="#d8c08f"/>
      <path d="M4 6.5v7M8 6.4v7.2M12 6.3v7.4" stroke="#b39864" stroke-width="1"/>
      <path d="M15 6.2 L93 2.6 Q99 10 93 17.4 L15 13.8 Z" fill="#f3eee2"/>
      <path d="M30 8l50-2.4M34 12.6l46 1.6" stroke="#ddd5c2" stroke-width=".8"/>

  <div class="skip"><strong>Toque para ouvir o Tony</strong><span>toque para pular</span></div>
  <div class="toast" id="toast" role="status"></div>

  <script type="module">
    import * as THREE from "three";

    const SRC = {
      face: "assets/face.webp", rig: "assets/rig.png",
      sai: "assets/r-sai.mp3", quem: "assets/r-quem.mp3", olhando: "assets/r-olhando.mp3",
      cutucar: "assets/r-cutucar.mp3", acordou: "assets/r-acordou.mp3",
      fotoDeRosto: "assets/foto-de-rosto.mp3", lindao: "assets/lindao.mp3",
    };

    const $ = (id) => document.getElementById(id);
    const rand = (a, b) => a + Math.random() * (b - a);
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const mobile = matchMedia("(max-width: 899px)").matches;
    // Teste: ?pisca=0.5 trava a pálpebra numa posição (0 = aberta, 1 = fechada)
    const forcedBlink = new URLSearchParams(location.search).has("pisca") ? +new URLSearchParams(location.search).get("pisca") : null;

    // ---------- Voz ----------
    // Envelope de volume (60 valores/s) calculado do próprio MP3: é o que abre e fecha a boca.
    let actx;
    async function envelopeOf(arrayBuffer) {
      actx ??= new (window.AudioContext || window.webkitAudioContext)();
      const buf = await actx.decodeAudioData(arrayBuffer);
      const data = buf.getChannelData(0), hop = Math.floor(buf.sampleRate / 60), env = [];
      for (let i = 0; i + hop <= data.length; i += hop) {
        let sum = 0;
        const end = Math.min(i + hop * 2, data.length);
        for (let j = i; j < end; j++) sum += data[j] * data[j];
        env.push(Math.sqrt(sum / (end - i)));
      }
      const p95 = [...env].sort((a, b) => a - b)[Math.floor(env.length * 0.95)] || 1;
      return env.map((v) => clamp((v - 0.01) / Math.max(p95 - 0.01, 1e-3), 0, 1));
    }

    const voice = { audio: null, env: null, open: 0, main: false };
    const reactions = {};
    for (const k of ["sai", "quem", "olhando", "cutucar", "acordou"]) reactions[k] = { audio: new Audio(), env: [] };
    // As falas de reação só são baixadas depois da abertura (e uma vez só: o mesmo arquivo vira áudio e envelope).
    function loadReactions() {
      for (const [k, clip] of Object.entries(reactions)) {
        fetch(SRC[k]).then((r) => r.arrayBuffer()).then(async (buf) => {
          clip.audio.src = URL.createObjectURL(new Blob([buf], { type: "audio/mpeg" }));
          clip.env = await envelopeOf(buf);
        }).catch(() => {});
      }
    }
    function say(clip, { main = false } = {}) {
      if (!clip.audio.src) return false;
      if (voice.audio && voice.main && !main) return false;
      if (voice.audio) {
        voice.audio.pause();
        if (karaFor && voice.audio === karaFor.audio && karaFor !== clip) clearKaraoke(); // cortou uma fala com legenda
      }
      const a = clip.audio;
      a.currentTime = 0;
      voice.audio = a; voice.env = clip.env; voice.main = main;
      stuckT = 0; stuckAt = performance.now();
      a.play().catch(() => { voice.audio = null; });
      a.onended = () => { if (voice.audio === a) { voice.audio = null; onVoiceEnd(main, clip); } };
      return true;
    }
    // Se o celular pausar o áudio por conta própria ou ele engasgar (3 s sem andar), o Tony para de "falar";
    // senão ficava preso na pose de fala, sem olhar em volta nem se mexer.
    let stuckT = 0, stuckAt = 0;
    function releaseStuckVoice(now) {
      const a = voice.audio;
      if (!a) return;
      if (a.currentTime !== stuckT) { stuckT = a.currentTime; stuckAt = now; }
      if (a.paused || a.ended || now - stuckAt > 3000) {
        const main = voice.main;
        a.pause(); voice.audio = null;
        onVoiceEnd(main, karaFor && karaFor.audio === a ? karaFor : null);
      }
    }
    const voiceLevel = () => (!voice.audio || voice.audio.paused) ? 0 : (voice.env[Math.floor(voice.audio.currentTime * 60)] || 0);

    // ---------- Renderer ----------
    const canvas = $("gl");
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: false, powerPreference: "high-performance" });
    // As folhas ficam num canvas próprio, atrás do título; fumaça e Tony ficam no da frente.
    const bgRenderer = new THREE.WebGLRenderer({ canvas: $("bg"), alpha: true, antialias: false });
    renderer.autoClear = false;
    renderer.setClearColor(0x000000, 0);
    let DPR = Math.min(devicePixelRatio, 1.25);

    // ---------- Simulação de fluido ----------
    // Adaptado de "WebGL Fluid Simulation" de Pavel Dobryakov (MIT): advecção, vorticidade e projeção de pressão.
    const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const quadScene = new THREE.Scene();
    const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
    quad.frustumCulled = false;
    quadScene.add(quad);

    const baseVert = /* glsl */`
      uniform vec2 texelSize;
      varying vec2 vUv, vL, vR, vT, vB;
      void main() {
        vUv = uv;
        vL = vUv - vec2(texelSize.x, 0.0); vR = vUv + vec2(texelSize.x, 0.0);
        vT = vUv + vec2(0.0, texelSize.y); vB = vUv - vec2(0.0, texelSize.y);
        gl_Position = vec4(position.xy, 0.0, 1.0);
      }`;
    const prog = (frag, uniforms) => new THREE.ShaderMaterial({
      vertexShader: baseVert, fragmentShader: frag,
      uniforms: { texelSize: { value: new THREE.Vector2() }, ...uniforms },
      depthTest: false, depthWrite: false, blending: THREE.NoBlending,
    });
    const tex = () => ({ value: null });
    const P = {
      splat: prog(`
        uniform sampler2D uTarget; uniform float aspect, radius; uniform vec3 color; uniform vec2 point;
        varying vec2 vUv;
        void main() {
          vec2 p = vUv - point; p.x *= aspect;
          gl_FragColor = vec4(texture2D(uTarget, vUv).xyz + exp(-dot(p, p) / radius) * color, 1.0);
        }`, { uTarget: tex(), aspect: { value: 1 }, radius: { value: 0.001 }, color: { value: new THREE.Vector3() }, point: { value: new THREE.Vector2() } }),
      mask: prog(`
        uniform sampler2D uTarget, uMask; uniform vec3 color;
        varying vec2 vUv;
        void main() { gl_FragColor = vec4(texture2D(uTarget, vUv).xyz + texture2D(uMask, vUv).a * color, 1.0); }`,
        { uTarget: tex(), uMask: tex(), color: { value: new THREE.Vector3() } }),
      attract: prog(`
        uniform sampler2D uTarget; uniform vec2 point; uniform float aspect, speed, swirl, mixk;
        varying vec2 vUv;
        void main() {
          vec2 v = texture2D(uTarget, vUv).xy;
          vec2 d = point - vUv; d.x *= aspect;
          float len = length(d);
          vec2 dir = d / max(len, 1e-4);
          vec2 want = (dir + vec2(-dir.y, dir.x) * swirl) * speed * smoothstep(0.0, 0.08, len) * (1.0 - smoothstep(0.2, 1.4, len));
          gl_FragColor = vec4(mix(v, want, mixk), 0.0, 1.0);
        }`, { uTarget: tex(), point: { value: new THREE.Vector2() }, aspect: { value: 1 }, speed: { value: 0 }, swirl: { value: 0 }, mixk: { value: 0 } }),
      absorb: prog(`
        uniform sampler2D uTarget; uniform vec2 point; uniform float aspect;
        varying vec2 vUv;
        void main() {
          vec2 d = point - vUv; d.x *= aspect;
          gl_FragColor = vec4(texture2D(uTarget, vUv).xyz * smoothstep(0.015, 0.07, length(d)), 1.0);
        }`, { uTarget: tex(), point: { value: new THREE.Vector2() }, aspect: { value: 1 } }),
      advect: prog(`
        uniform sampler2D uVelocity, uSource; uniform vec2 velTexel; uniform float dt, dissipation;
        varying vec2 vUv;
        void main() {
          vec2 coord = vUv - dt * texture2D(uVelocity, vUv).xy * velTexel;
          gl_FragColor = texture2D(uSource, coord) / (1.0 + dissipation * dt);
        }`, { uVelocity: tex(), uSource: tex(), velTexel: { value: new THREE.Vector2() }, dt: { value: 0 }, dissipation: { value: 0 } }),
      divergence: prog(`
        uniform sampler2D uVelocity; varying vec2 vUv, vL, vR, vT, vB;
        void main() {
          float L = texture2D(uVelocity, vL).x, R = texture2D(uVelocity, vR).x;
          float T = texture2D(uVelocity, vT).y, B = texture2D(uVelocity, vB).y;
          vec2 C = texture2D(uVelocity, vUv).xy;
          if (vL.x < 0.0) L = -C.x; if (vR.x > 1.0) R = -C.x;
          if (vT.y > 1.0) T = -C.y; if (vB.y < 0.0) B = -C.y;
          gl_FragColor = vec4(0.5 * (R - L + T - B), 0.0, 0.0, 1.0);
        }`, { uVelocity: tex() }),
      curl: prog(`
        uniform sampler2D uVelocity; varying vec2 vUv, vL, vR, vT, vB;
        void main() {
          float L = texture2D(uVelocity, vL).y, R = texture2D(uVelocity, vR).y;
          float T = texture2D(uVelocity, vT).x, B = texture2D(uVelocity, vB).x;
          gl_FragColor = vec4(0.5 * (R - L - T + B), 0.0, 0.0, 1.0);
        }`, { uVelocity: tex() }),
      vorticity: prog(`
        uniform sampler2D uVelocity, uCurl; uniform float curl, dt; varying vec2 vUv, vL, vR, vT, vB;
        void main() {
          float L = texture2D(uCurl, vL).x, R = texture2D(uCurl, vR).x, T = texture2D(uCurl, vT).x, B = texture2D(uCurl, vB).x;
          float C = texture2D(uCurl, vUv).x;
          vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
          force /= length(force) + 0.0001; force *= curl * C; force.y *= -1.0;
          vec2 vel = texture2D(uVelocity, vUv).xy + force * dt;
          gl_FragColor = vec4(clamp(vel, -1000.0, 1000.0), 0.0, 1.0);
        }`, { uVelocity: tex(), uCurl: tex(), curl: { value: 0 }, dt: { value: 0 } }),
      clear: prog(`
        uniform sampler2D uTexture; uniform float value; varying vec2 vUv;
        void main() { gl_FragColor = value * texture2D(uTexture, vUv); }`, { uTexture: tex(), value: { value: 0 } }),
      pressure: prog(`
        uniform sampler2D uPressure, uDivergence; varying vec2 vUv, vL, vR, vT, vB;
        void main() {
          float L = texture2D(uPressure, vL).x, R = texture2D(uPressure, vR).x, T = texture2D(uPressure, vT).x, B = texture2D(uPressure, vB).x;
          gl_FragColor = vec4((L + R + B + T - texture2D(uDivergence, vUv).x) * 0.25, 0.0, 0.0, 1.0);
        }`, { uPressure: tex(), uDivergence: tex() }),
      gradient: prog(`
        uniform sampler2D uPressure, uVelocity; varying vec2 vUv, vL, vR, vT, vB;
        void main() {
          float L = texture2D(uPressure, vL).x, R = texture2D(uPressure, vR).x, T = texture2D(uPressure, vT).x, B = texture2D(uPressure, vB).x;
          gl_FragColor = vec4(texture2D(uVelocity, vUv).xy - vec2(R - L, T - B), 0.0, 1.0);
        }`, { uPressure: tex(), uVelocity: tex() }),
    };

    // Fumaça na tela: cor normalizada + relevo pelo gradiente da densidade
    const display = new THREE.ShaderMaterial({
      vertexShader: baseVert,
      fragmentShader: /* glsl */`
        uniform sampler2D uTexture; uniform float opacity, uTrip, uTime; varying vec2 vUv, vL, vR, vT, vB;
        void main() {
          // doidão: a fumaça ondula
          vec2 uv = vUv + uTrip * 0.014 * vec2(sin(vUv.y * 17.0 + uTime * 2.1), cos(vUv.x * 13.0 + uTime * 1.6));
          vec3 c = texture2D(uTexture, uv).rgb;
          float dx = length(texture2D(uTexture, vR).rgb) - length(texture2D(uTexture, vL).rgb);
          float dy = length(texture2D(uTexture, vT).rgb) - length(texture2D(uTexture, vB).rgb);
          vec3 n = normalize(vec3(dx, dy, 0.05));
          float light = clamp(dot(n, normalize(vec3(-0.4, 0.6, 1.0))) + 0.8, 0.8, 1.08);
          float a = max(c.r, max(c.g, c.b));
          vec3 col = c / max(a, 0.001) * light;
          gl_FragColor = vec4(col, clamp(a * 1.1, 0.0, 0.92) * opacity);
        }`,
      uniforms: { uTexture: tex(), texelSize: { value: new THREE.Vector2() }, opacity: { value: 1 }, uTrip: { value: 0 }, uTime: { value: 0 } },
      transparent: true, depthTest: false, depthWrite: false,
    });
    const displayScene = new THREE.Scene();
    const displayQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), display);
    displayQuad.frustumCulled = false;
    displayScene.add(displayQuad);

    const CFG = { sim: mobile ? 96 : 128, dye: mobile ? 256 : 512, densityDiss: 0.55, velDiss: 0.18, pressure: 0.8, iters: 12, curl: 24 };
    const rt = (w, h) => new THREE.WebGLRenderTarget(w, h, {
      type: THREE.HalfFloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false,
    });
    const double = (w, h) => {
      let a = rt(w, h), b = rt(w, h);
      return { get read() { return a; }, get write() { return b; }, swap() { [a, b] = [b, a]; }, texel: new THREE.Vector2(1 / w, 1 / h), w, h };
    };
    const resOf = (r) => {
      let aspect = innerWidth / innerHeight; if (aspect < 1) aspect = 1 / aspect;
      const min = Math.round(r), max = Math.round(r * aspect);
      return innerWidth > innerHeight ? [max, min] : [min, max];
    };
    let velocity, dye, divergenceRT, curlRT, pressure;
    function initFluid() {
      for (const t of [velocity?.read, velocity?.write, dye?.read, dye?.write, pressure?.read, pressure?.write, divergenceRT, curlRT]) t?.dispose();
      const [sw, sh] = resOf(CFG.sim), [dw, dh] = resOf(CFG.dye);
      velocity = double(sw, sh); dye = double(dw, dh); pressure = double(sw, sh);
      divergenceRT = rt(sw, sh); curlRT = rt(sw, sh);
    }
    function pass(mat, target, texel) {
      mat.uniforms.texelSize.value.copy(texel);
      quad.material = mat;
      renderer.setRenderTarget(target);
      renderer.render(quadScene, quadCam);
    }
    const aspect = () => innerWidth / innerHeight;

    function splat(x, y, dx, dy, color, radius = 0.25) {
      const s = P.splat.uniforms;
      s.aspect.value = aspect(); s.point.value.set(x, y);
      s.radius.value = (radius / 100) * (aspect() > 1 ? aspect() : 1);
      s.uTarget.value = velocity.read.texture; s.color.value.set(dx, dy, 0);
      pass(P.splat, velocity.write, velocity.texel); velocity.swap();
      s.uTarget.value = dye.read.texture; s.color.value.set(...color);
      pass(P.splat, dye.write, dye.texel); dye.swap();
    }

    function step(dt) {
      P.curl.uniforms.uVelocity.value = velocity.read.texture;
      pass(P.curl, curlRT, velocity.texel);
      Object.assign(P.vorticity.uniforms, {});
      P.vorticity.uniforms.uVelocity.value = velocity.read.texture; P.vorticity.uniforms.uCurl.value = curlRT.texture;
      P.vorticity.uniforms.curl.value = CFG.curl; P.vorticity.uniforms.dt.value = dt;
      pass(P.vorticity, velocity.write, velocity.texel); velocity.swap();

      P.divergence.uniforms.uVelocity.value = velocity.read.texture;
      pass(P.divergence, divergenceRT, velocity.texel);
      P.clear.uniforms.uTexture.value = pressure.read.texture; P.clear.uniforms.value.value = CFG.pressure;
      pass(P.clear, pressure.write, velocity.texel); pressure.swap();
      P.pressure.uniforms.uDivergence.value = divergenceRT.texture;
      for (let i = 0; i < CFG.iters; i++) {
        P.pressure.uniforms.uPressure.value = pressure.read.texture;
        pass(P.pressure, pressure.write, velocity.texel); pressure.swap();
      }
      P.gradient.uniforms.uPressure.value = pressure.read.texture; P.gradient.uniforms.uVelocity.value = velocity.read.texture;
      pass(P.gradient, velocity.write, velocity.texel); velocity.swap();

      const a = P.advect.uniforms;
      a.velTexel.value.copy(velocity.texel); a.dt.value = dt;
      a.uVelocity.value = velocity.read.texture; a.uSource.value = velocity.read.texture; a.dissipation.value = CFG.velDiss;
      pass(P.advect, velocity.write, velocity.texel); velocity.swap();
      a.uVelocity.value = velocity.read.texture; a.uSource.value = dye.read.texture; a.dissipation.value = CFG.densityDiss;
      pass(P.advect, dye.write, dye.texel); dye.swap();
    }

    // Inalação: puxa velocidade (e some com a fumaça) em direção à boca
    function inhaleStep(mx, my, k) {
      const at = P.attract.uniforms;
      at.uTarget.value = velocity.read.texture; at.point.value.set(mx, my); at.aspect.value = aspect();
      at.speed.value = 260 * k; at.swirl.value = 0.35; at.mixk.value = 0.12 * k;
      pass(P.attract, velocity.write, velocity.texel); velocity.swap();
      const ab = P.absorb.uniforms;
      ab.uTarget.value = dye.read.texture; ab.point.value.set(mx, my); ab.aspect.value = aspect();
      pass(P.absorb, dye.write, dye.texel); dye.swap();
    }

    // Texto vira fumaça: desenha a frase onde ela está na tela e injeta na densidade
    const textCanvas = document.createElement("canvas");
    const textTex = new THREE.CanvasTexture(textCanvas);
    function textToSmoke(el, str) {
      const s = 0.5;
      textCanvas.width = Math.round(innerWidth * s); textCanvas.height = Math.round(innerHeight * s);
      const g = textCanvas.getContext("2d");
      const r = el.getBoundingClientRect();
      const size = clamp(r.width / 11, 22, 46);
      g.font = `800 ${size * s}px "Bricolage Grotesque", sans-serif`;
      g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle";
      const words = str.split(/\s+/), lines = [], maxW = r.width * 0.92 * s;
      let line = "";
      for (const w of words) {
        const test = line ? line + " " + w : w;
        if (g.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
      }
      lines.push(line);
      const lh = size * 1.05 * s, cy = (r.top - lines.length * size * 0.6 - 20) * s;
      lines.slice(0, 6).forEach((l, i) => g.fillText(l, (r.left + r.width / 2) * s, cy + (i - (lines.length - 1) / 2) * lh));
      textTex.needsUpdate = true;
      const m = P.mask.uniforms;
      m.uTarget.value = dye.read.texture; m.uMask.value = textTex; m.color.value.set(0.85, 1.0, 0.8);
      pass(P.mask, dye.write, dye.texel); dye.swap();
    }

    // ---------- O Tony ----------
    const W = 430, H = 630, FACE_H = 1, FACE_W = W / H;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 20);
    const head = new THREE.Group();
    scene.add(head);

    const loader = new THREE.TextureLoader();
    const tFace = loader.load(SRC.face, (t) => readAlpha(t.image));
    tFace.colorSpace = THREE.SRGBColorSpace;
    const tRig = loader.load(SRC.rig);

    const tony = {
      tFace: { value: tFace }, tRig: { value: tRig },
      uDepth: { value: 0.2 }, uOpen: { value: 0 }, uBlink: { value: 0 }, uReveal: { value: reduced ? 1.2 : 0 },
      uGaze: { value: new THREE.Vector2() }, uLight: { value: new THREE.Vector3(0.4, 0.6, 1) },
    };
    const faceMat = new THREE.ShaderMaterial({
      uniforms: tony, transparent: true,
      vertexShader: /* glsl */`
        uniform sampler2D tRig; uniform float uDepth;
        varying vec2 vUv; varying vec3 vPos;
        void main() {
          vUv = uv;
          vec4 mv = modelViewMatrix * vec4(position + vec3(0.0, 0.0, texture2D(tRig, uv).r * uDepth), 1.0);
          vPos = mv.xyz;
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: /* glsl */`
        uniform sampler2D tFace, tRig;
        uniform float uOpen, uBlink, uReveal;
        uniform vec2 uGaze; uniform vec3 uLight;
        varying vec2 vUv; varying vec3 vPos;
        const vec2 SIZE = vec2(430.0, 630.0);
        const float Y0 = 366.0;

        vec2 toUv(vec2 p) { return vec2(p.x / SIZE.x, 1.0 - p.y / SIZE.y); }

      display.uniforms.uTrip.value = reduced ? 0 : trip;
      display.uniforms.uTime.value = t;
      const filter = trip > 0.003
        ? `hue-rotate(${(reduced ? 60 : 160 * Math.sin(t * 0.7)) * trip}deg) saturate(${1 + trip * 1.8}) contrast(${1 + trip * 0.12})`
        : "";
      for (const el of tripEls) if (el.style.filter !== filter) el.style.filter = filter;
    }

    canvas.addEventListener("pointerdown", (e) => {
      if (mode === "intro") return endIntro();
      if (drag) { drag = null; canvas.classList.remove("dragging"); } // sobrou de um toque que não terminou
      interacted = true; lastInput = performance.now(); wake();
      pointer.x = pointer.px = e.clientX; pointer.y = pointer.py = e.clientY; pointer.has = true;
      const uv = mode === "idle" ? hitTony(e.clientX, e.clientY) : null;
      if (e.pointerType !== "mouse") joint.on = !uv;
      if (uv) {
        drag = { x0: e.clientX, y0: e.clientY, uv, moved: 0, id: e.pointerId };
        try { canvas.setPointerCapture(e.pointerId); } catch {}
        canvas.classList.add("dragging");
      } else {
        // toque fora do Tony: uma baforada onde tocou
        splat(e.clientX / innerWidth, 1 - e.clientY / innerHeight, rand(-80, 80), 160, [0.18, 0.24, 0.17], 0.6);
      }
    });
    canvas.addEventListener("pointermove", (e) => { if (drag) drag.moved = Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0); });
    // Soltou o dedo: cutucão (ou fim do arrasto). Escuta na janela inteira e também no cancelamento do toque,
    // senão um toque cancelado pelo celular (ou solto em cima da caixa de texto) deixava o Tony preso, parado.
    function endDrag(e) {
      if (!drag || (e.pointerId !== undefined && e.pointerId !== drag.id)) return;
      const d = drag;
      drag = null;
      canvas.classList.remove("dragging");
      if (e.type === "pointercancel") return;
      const side = d.uv.x - 0.5, vert = 0.5 - d.uv.y;
      if (d.moved < 8) { yaw.v -= side * 9; pitch.v += vert * 7; roll.v += side * 10; squash.v += 4.5; gx.x += rand(-6, 6); }
      else roll.v += (yaw.x > 0 ? -1 : 1) * 6;
      blinkAt = performance.now();
      const [mx, my] = mouthUv();
      splat(mx, my, rand(-150, 150), 220, [0.2, 0.26, 0.19], 0.15); // tosse fumaça
      markPoked();
      react();
    }
    addEventListener("pointerup", endDrag);
    addEventListener("pointercancel", endDrag);

    const pickBtn = $("pickBtn");
    pickBtn.addEventListener("focus", () => (focusTarget = pickBtn));
    pickBtn.addEventListener("blur", () => (focusTarget = null));

    function zzz() {
      const [mx, my] = mouthUv();
      splat(mx + 0.02, my + 0.02, 30, 90, [0.06, 0.08, 0.06], 0.12);
    }

    // ---------- Legenda karaokê ----------
    // Trechos de até 6 palavras, quebrando na pontuação.
    const kara = $("kara");
    let words = [], segments = [], segIdx = -1;
    let karaFor = null; // a fala (resultado ou frase do pessoal) cujas palavras estão na legenda
    function setWords(list) {
      words = list; segments = []; segIdx = -1;
      let cur = [];
      words.forEach((w, i) => { cur.push({ ...w, i }); if (/[,.!?]$/.test(w.w) || cur.length >= 6) { segments.push(cur); cur = []; } });
      if (cur.length) segments.push(cur);
    }
    // Sem tempos do servidor: distribui as palavras pelo trecho com voz, proporcional ao tamanho de cada uma.
    function estimateWords(str, env) {
      const voiced = env.map((v, i) => (v > 0.15 ? i : -1)).filter((i) => i >= 0);
      const t0 = (voiced[0] ?? 0) / 60, t1 = (voiced.at(-1) ?? env.length) / 60;
      const list = str.split(/\s+/).filter(Boolean), total = list.reduce((s, w) => s + w.length + 1, 0);
      let t = t0;
      return list.map((w) => { const d = (t1 - t0) * (w.length + 1) / total; const item = { w, t0: t, t1: t + d }; t += d; return item; });
    }
    function updateKaraoke(t) {
      const si = segments.findIndex((s) => t >= s[0].t0 - 0.05 && t < (s[s.length - 1].t1 + 0.35));
      if (si !== segIdx) {
        if (segIdx >= 0) { kara.classList.add("leave"); }
        segIdx = si;
        if (si >= 0) {
          const seg = segments[si], segs = segments;
          setTimeout(() => {
            if (segIdx !== si || segments !== segs) return; // trocou de fala nesse meio-tempo
            kara.classList.remove("leave");
            kara.replaceChildren(...seg.map((w) => {
              const span = document.createElement("span");
              span.className = "w"; span.textContent = w.w; span.word = w; // cada palavra leva os próprios tempos
              return span;
            }));
          }, kara.children.length ? 220 : 0);
        }
      }
      for (const el of kara.children) {
        const w = el.word;
        if (!w) continue;
        el.classList.toggle("on", t >= w.t0);
        el.classList.toggle("now", t >= w.t0 && t < w.t1 + 0.05);
      }
    }
    function clearKaraoke() { kara.classList.add("leave"); segIdx = -1; setTimeout(() => { if (segIdx < 0) kara.replaceChildren(); }, 700); }

    // ---------- Loop ----------
    let prevLevel = 0, ambientT = 0, wispT = 0, zT = 0, revealT = 0, frameN = 0;
    const clock = new THREE.Clock();
    const zator = document.querySelectorAll(".t .b");

    function frame() {
      requestAnimationFrame(frame); // já agenda o próximo: um erro num quadro não congela a página
      const dt = Math.min(clock.getDelta(), 1 / 30);
      adaptQuality();
      const now = performance.now(), t = clock.elapsedTime;
      modeT += dt;
      const idle = now - lastInput;
      releaseStuckVoice(now);
      updateJoint(dt, t);
      const level = voiceLevel() * (toke.on ? 0.35 : 1); // com o baseado na boca, mal abre
      const talking = !!voice.audio;
      const [mx, my] = mouthUv();

      // ----- fumaça: fontes -----
      if (mode === "intro") {
        const it = (now - introStart) / 1000; // relógio real: a abertura dura o mesmo em qualquer aparelho
        // abertura: fumaça sobe do chão, o Tony se forma dentro dela
        if (it < 1.6 && Math.random() < 0.35)
          splat(rand(0.25, 0.75), rand(0.0, 0.06), rand(-80, 80), rand(450, 850), [0.06, 0.08, 0.055].map((c) => c * rand(0.6, 1.4)), 0.7);
        if (it > 0.9 && it < 2.4 && Math.random() < 0.5) {
          const s = tonyScreen(rand(-0.3, 0.4));
          splat(s.x / innerWidth + rand(-0.12, 0.12), 1 - s.y / innerHeight, rand(-50, 50), rand(60, 160), [0.08, 0.1, 0.07], 0.35);
        }
        revealT = clamp((it - 0.9) / 1.6, 0, 1);
        tony.uReveal.value = revealT * 1.1;
        if (it > 1.5 && document.body.classList.contains("intro")) document.body.classList.remove("intro");
        if (it > 2.8) endIntro();
      }
      ambientT -= dt;
      if (ambientT < 0 && !reduced) {
        ambientT = rand(0.18, 0.4);
        const side = Math.random() < 0.5 ? rand(0.04, 0.3) : rand(0.7, 0.96);
        splat(side, 0.0, rand(-30, 30), rand(160, 300), smokeColor([0.035, 0.045, 0.032], t), 0.4);
      }
      if (pointer.moved && !drag) {
        const dx = (pointer.x - pointer.px) / innerWidth, dy = -(pointer.y - pointer.py) / innerHeight;
        const ox = joint.on ? joint.tipX : pointer.x, oy = joint.on ? joint.tipY : pointer.y;
        if (Math.abs(dx) + Math.abs(dy) > 0.0005)
          splat(ox / innerWidth, 1 - oy / innerHeight, dx * 5000, dy * 5000, smokeColor([0.012, 0.016, 0.011], t), 0.25);
        pointer.px = pointer.x; pointer.py = pointer.y; pointer.moved = false;
      }
      if (mode === "inhale") {
        inhaleStep(mx, my, Math.min(1, modeT / 0.4));
        if (modeT > 1.7) { mode = "hold"; modeT = 0; }
      }
      if (talking && !reduced) {
        if (level > 0.35 && prevLevel <= 0.25) {
          const side = rand(-1, 1);
          splat(mx, my, side * rand(150, 320), rand(200, 380), [0.16, 0.2, 0.15].map((c) => c * (0.6 + level)), 0.12);
        }
        wispT -= dt;
        if (voice.open > 0.3 && wispT < 0) { wispT = 0.08; splat(mx, my, rand(-60, 60), rand(120, 200), [0.04, 0.05, 0.035], 0.08); }
      }
      prevLevel = level;
      if (sleeping) { zT += dt; if (zT > 1.6) { zT = 0; zzz(); } }

      step(dt);

      // ----- boca, legenda e tremor do "Zator" -----
      voice.open += (level - voice.open) * (level > voice.open ? 0.7 : 0.35);
      tony.uOpen.value = voice.open;
      const jx = (Math.random() - 0.5) * voice.open * 8, jy = (Math.random() - 0.5) * voice.open * 5;
      const wob = reduced ? 0 : trip;
      zator.forEach((z, i) => {
        z.style.transform = `translate(${jx}px, ${jy + Math.sin(t * 2.3 + i) * 14 * wob}px) rotate(${Math.sin(t * 1.7 + i) * 5 * wob}deg) skewX(${Math.sin(t * 1.1) * 8 * wob}deg)`;
      });
      if (karaFor && voice.audio === karaFor.audio) updateKaraoke(karaFor.audio.currentTime);
      placeHint(mode === "idle" && hintVisible(now) && !talking && !drag);

      // ----- para onde olhar -----
      if (mode === "idle" && !talking && !sleeping && !drag && interacted && idle > 9000 && now - lastMutter > 40000) {
        lastMutter = now; glance = { x: -1.3, y: -0.2, until: now + 900, then: { x: 1.3, y: -0.2 } };
        say(reactions.quem);
      }
      if (mode === "idle" && !talking && !sleeping && !drag && idle > 18000) sleeping = true;

      let lx = 0, ly = 0;
      const c = tonyScreen();
      if (focusTarget) {
        const r = focusTarget.getBoundingClientRect();
        lx = (r.left + r.width / 2 - c.x) / (innerWidth / 2); ly = (r.top + 10 - c.y) / (innerHeight / 2);
      } else if (pointer.has) {
        lx = (pointer.x - c.x) / (innerWidth / 2); ly = (pointer.y - c.y) / (innerHeight / 2);
      }
      lx = clamp(lx, -1.3, 1.3); ly = clamp(ly, -1, 1);

      if (!reduced && mode === "idle" && !sleeping && !talking && !drag && !focusTarget) {
        if (now > nextGlance && !glance) {
          const side = Math.random() < 0.5 ? -1 : 1;
          glance = { x: side * rand(1.1, 1.5), y: rand(-0.6, 0.5), until: now + rand(350, 900),
                     then: Math.random() < 0.35 ? { x: -side * rand(1.1, 1.5), y: rand(-0.4, 0.3) } : null };
          nextGlance = now + rand(2500, 6500);
        }
        if (now > nextTwitch) { roll.v += rand(-2.4, 2.4); yaw.v += rand(-1.6, 1.6); gx.x += rand(-4, 4); nextTwitch = now + rand(4000, 10000); }
      }
      if (glance) {
        lx = glance.x; ly = glance.y;
        if (now > glance.until) glance = glance.then ? { ...glance.then, until: now + rand(300, 700), then: null } : null;
      }

      let blinkBase = 0;
      if (mode === "inhale") {
        yaw.t = 0; pitch.t = -0.16; roll.t = 0; gx.t = 0; gy.t = -4; blinkBase = 0.25; squash.t = -0.6;
      } else if (mode === "hold") {
        yaw.t = Math.sin(t * 9) * 0.015; pitch.t = -0.1; roll.t = 0; gx.t = rand(-1, 1); gy.t = -3; blinkBase = 0.45; squash.t = -0.5;
      } else if (sleeping) {
        yaw.t = 0; pitch.t = 0.32 + Math.sin(t * 0.9) * 0.03; roll.t = 0.16; gx.t = 0; gy.t = 5; blinkBase = 0.9; squash.t = 0;
      } else if (drag) {
        yaw.t = clamp((pointer.x - drag.x0) / 300, -0.6, 0.6); pitch.t = clamp((pointer.y - drag.y0) / 400, -0.4, 0.4);
        roll.t = -yaw.t * 0.4; gx.t = rand(-7, 7); gy.t = rand(-3, 3); squash.t = 0;
      } else if (talking) {
        yaw.t = lx * 0.12 + Math.sin(t * 2.1) * 0.05; pitch.t = -0.02 + voice.open * 0.09; roll.t = Math.sin(t * 2.7) * 0.05;
        gx.t = lx * 3; gy.t = ly * 2; squash.t = 0;
      } else {
        yaw.t = lx * (glance ? 0.22 : 0.36); pitch.t = ly * 0.2; roll.t = -lx * 0.05;
        gx.t = lx * 7.5; gy.t = ly * 4.5; squash.t = 0;
        if (idle > 11000) blinkBase = 0.22;
      }
      if (trip > 0.01 && !reduced) {
        yaw.t += Math.sin(t * 0.9) * 0.16 * trip; roll.t += Math.sin(t * 0.7 + 1) * 0.09 * trip;
        pitch.t += 0.05 * trip; gx.t += Math.sin(t * 0.5) * 3 * trip;
        blinkBase = Math.max(blinkBase, 0.42 * trip);
      }
      for (const s of [yaw, pitch, roll, squash, gx, gy]) s.step(dt);

      head.rotation.set(pitch.x, yaw.x, roll.x);
      head.position.x = baseX;
      head.position.y = baseY + Math.sin(t * (sleeping ? 1.2 : 2.0)) * 0.006 - Math.abs(squash.x) * 0.02;
      head.scale.set(1 + squash.x * 0.04, 1 - squash.x * 0.05, 1);
      tony.uGaze.value.set(clamp(gx.x, -8, 8), clamp(gy.x, -5, 5));
      tony.uLight.value.set(0.3 + lx * 0.5, 0.6 - ly * 0.4, 1);

      let blink = blinkBase;
      const bt = (now - blinkAt) / 1000;
      if (bt >= 0 && bt < 0.22) blink = Math.max(blink, bt < 0.08 ? bt / 0.08 : 1 - (bt - 0.08) / 0.14);
      if (bt >= 0.22 && !sleeping) {
        if (!blinkDouble && Math.random() < 0.25) { blinkDouble = true; blinkAt = now + 60; }
        else { blinkDouble = false; blinkAt = now + rand(1600, 4200); }
      }
      tony.uBlink.value = forcedBlink ?? blink;

      // ----- folhas: balanço lento, parallax com o dedo, pulso com a voz -----
      if (!reduced) {
        for (const l of leaves) {
          l.mesh.rotation.z = l.rz + Math.sin(t * l.sp + l.ph) * 0.08 * (1 + trip * 5);
          l.mesh.position.y = l.y + Math.sin(t * l.sp * 0.7 + l.ph) * 0.12 * (1 + trip * 3);
        }
        leafGroup.rotation.z = Math.sin(t * 0.4) * 0.25 * trip;
        const px = pointer.has ? (pointer.x / innerWidth - 0.5) : 0, py = pointer.has ? (pointer.y / innerHeight - 0.5) : 0;
        par.x += (px - par.x) * 0.04; par.y += (py - par.y) * 0.04;
        bgCam.position.set(par.x * 0.9, -par.y * 0.6, 6);
        bgCam.lookAt(0, 0, -4);
      }
      leafGroup.scale.setScalar(1 + voice.open * 0.025 + (reduced ? 0 : Math.sin(t * 2.6) * 0.06 * trip));
      applyTrip(t);

      // ----- desenho: folhas, fumaça atrás, Tony, fumaça na frente -----
      renderer.setRenderTarget(null);
      renderer.clear();
      if ((frameN++ & 1) === 0) bgRenderer.render(bgScene, bgCam); // folhas a 30 fps bastam
      display.uniforms.uTexture.value = dye.read.texture;
      display.uniforms.texelSize.value.copy(dye.texel);
      display.uniforms.opacity.value = 1;
      renderer.render(displayScene, quadCam);
      renderer.clearDepth();
      renderer.render(scene, camera);
      display.uniforms.opacity.value = 0.38;
      renderer.render(displayScene, quadCam);
    }

    // Qualidade adaptativa: se o aparelho não segurar ~45 fps, baixa a resolução (até duas vezes).
    let fpsCheck = null, qualityDrops = 0;
    function adaptQuality() {
      if (!fpsCheck) return;
      fpsCheck.n++;
      const el = performance.now() - fpsCheck.t0;
      if (el < 2000) return;
      const fps = fpsCheck.n / (el / 1000);
      fpsCheck = null;
      if (fps < 45 && qualityDrops < 2) {
        qualityDrops++;
        DPR = Math.max(0.75, DPR * 0.7);
        CFG.dye = Math.max(192, CFG.dye * 0.7);
        CFG.iters = Math.max(6, CFG.iters - 4);
        resize();
        fpsCheck = { t0: performance.now(), n: 0 };
      }
    }

    function endIntro() {
      if (mode !== "intro") return;
      mode = "idle"; modeT = 0; scheduleHint(performance.now() + 1500);
      tony.uReveal.value = 1.2;
      document.body.classList.remove("intro");
      setTimeout(() => document.body.classList.remove("intro-tail"), 2500);
      loadReactions();
      loadPhrase();
      fpsCheck = { t0: performance.now(), n: 0 };
    }

    // "TonyZator" de margem a margem: mede a tinta da palavra na fonte real (a 100px, com o mesmo
    // espaçamento de -0.06em), escala para a largura útil e compensa a folga lateral do "T".
    const measure = document.createElement("canvas").getContext("2d");
    function fitTitle() {
      const m = document.querySelector(".lead").getBoundingClientRect().left;
      measure.font = `800 100px "Bricolage Grotesque"`;
      measure.letterSpacing = "-6px";
      const box = measure.measureText("TonyLooks");
      const size = (innerWidth - m * 2) / (box.actualBoundingBoxLeft + box.actualBoundingBoxRight) * 100;
      const root = document.documentElement.style;
      root.setProperty("--display", `${size}px`);
      root.setProperty("--ink-l", `${-box.actualBoundingBoxLeft * size / 100}px`);
    }
    document.fonts.ready.then(() => { fitTitle(); resize(); });
    addEventListener("resize", () => { fitTitle(); resize(); });
    resize();
    if (reduced) endIntro();
    requestAnimationFrame(frame);

    // ======================================================================
    // Tony Looks: envio da foto, efeitos, IA e as falas do Tony
    // ======================================================================
    const err = $("err"), compose = $("compose"), result = $("result");
    const fileInput = $("fileInput"), fxCanvas = $("fxCanvas");
    const tabFx = $("tabFx"), tabAi = $("tabAi"), panelFx = $("panelFx"), panelAi = $("panelAi");
    const aiBtn = $("aiBtn"), aiImg = $("aiImg"), aiEmpty = $("aiEmpty"), aiStatus = $("aiStatus"), aiError = $("aiError");

    const dockObs = new ResizeObserver(() => {
      const d = compose.hidden ? result : compose;
      document.documentElement.style.setProperty("--dock-h", `${d.offsetHeight + 14}px`);
    });
    dockObs.observe(compose); dockObs.observe(result);

    let toastTimer;
    function toast(t) {
      const el = $("toast"); el.textContent = t; el.classList.add("show");
      clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
    }

    // ---------- Falas: "foto de rosto" ao entrar e "lindão" depois de gerar ----------
    const clips = { fotoDeRosto: { audio: new Audio(), env: [] }, lindao: { audio: new Audio(), env: [] } };
    const clipsReady = Promise.all(Object.entries(clips).map(([k, clip]) =>
      fetch(SRC[k]).then((r) => r.arrayBuffer()).then(async (buf) => {
        clip.audio.src = URL.createObjectURL(new Blob([buf], { type: "audio/mpeg" }));
        clip.audio.preload = "auto";
        clip.env = await envelopeOf(buf);
      }).catch(() => {})
    ));

    // Só para conferir no console se as falas estão tocando
    window.__tonyLooks = { clips, voice, get introSaid() { return introSaid; } };

    function onVoiceEnd(main, clip) {
      lastInput = performance.now();
      if (clip && clip === karaFor) clearKaraoke();
    }

    // O navegador só deixa tocar som depois de um toque/clique. Tenta ao terminar a abertura;
    // se for bloqueado, toca no primeiro toque na página.
    let introSaid = false;
    async function sayIntro() {
      if (introSaid) return;
      await clipsReady;
      if (introSaid || mode === "intro" || voice.audio) return;
      actx?.resume();
      const a = clips.fotoDeRosto.audio;
      a.addEventListener("playing", () => { introSaid = true; }, { once: true });
      lastInput = performance.now(); wake();
      say(clips.fotoDeRosto, { main: true });
    }
    const introWatch = setInterval(() => { if (mode !== "intro") { clearInterval(introWatch); setTimeout(sayIntro, 300); } }, 200);
    for (const ev of ["pointerdown", "keydown", "touchend"]) {
      addEventListener(ev, () => { if (!introSaid) setTimeout(sayIntro, mode === "intro" ? 3200 : 50); }, { passive: true });
    }

    function sayLindao() {
      clipsReady.then(() => { lastInput = performance.now(); wake(); say(clips.lindao, { main: true }); });
    }

    // Baforada do Tony quando a foto fica pronta
    function tonyExhale() {
      mode = "idle"; modeT = 0;
      const [mx, my] = mouthUv();
      for (let i = 0; i < 10; i++) {
        const ang = rand(-1.2, 1.2) + Math.PI / 2;
        splat(mx, my, Math.cos(ang) * rand(300, 650), Math.sin(ang) * rand(300, 650), [0.16, 0.2, 0.15], 0.18);
      }
    }

    // No celular o painel do resultado é alto: o Tony sobe e diminui para a boca ficar à mostra
    function compactTony(on) {
      if (!mobile) return;
      LAYOUT.cy = on ? 0.33 : 0.47;
      LAYOUT.h = on ? 0.3 : 0.45;
      resize();
    }

    // ---------- Estado da foto ----------
    let sourceImg = null;      // foto enviada (já reduzida)
    let hasFace = false;
    let aiBlob = null;         // resultado da IA
    let activeTab = "fx";

    /* ---------- Adesivos (gerados por IA, fundo transparente) ---------- */
    const STICKERS = ['baseado'];
    // Pontas do baseado.png (fração da largura/altura): piteira em cima à esquerda, brasa embaixo à direita
    const JOINT_FILTER = { x: 0.013, y: 0.013 }, JOINT_EMBER = { x: 0.977, y: 0.893 };
    const sticker = {};
    const stickersReady = Promise.all(STICKERS.map(n => new Promise(res => {
        const im = new Image();
        im.onload = () => { sticker[n] = im; res(); };
        im.onerror = () => res(); // sem o adesivo, o efeito segue sem ele
        im.src = `assets/${n}.png`;
    })));

    /* ---------- Detector de rosto (carrega uma vez) ---------- */
    let landmarkerPromise = null;
    function getLandmarker() {
        if (!landmarkerPromise) {
            // Carrega o detector sob demanda: se falhar, o app segue sem ele (vira modo cena)
            landmarkerPromise = (async () => {
                const { FaceLandmarker, FilesetResolver } = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
                const fileset = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
                return FaceLandmarker.createFromOptions(fileset, {
                    baseOptions: {
                        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task'
                    },
                    runningMode: 'IMAGE',
                    numFaces: 4
                });
            })().catch(err => { console.warn('Detector de rosto indisponível:', err); return null; });
        }
        return landmarkerPromise;
    }
    getLandmarker();

    /* ---------- Utilidades ---------- */

    // Lê o arquivo e reduz para no máximo 1280 px no lado maior (mais rápido e leve)
    function loadImage(file) {
        return new Promise((resolve, reject) => {
            const url = URL.createObjectURL(file);
            const im = new Image();
            im.onload = () => {
                const max = 1280;
                const k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
                const c = document.createElement('canvas');
                c.width = Math.round(im.naturalWidth * k);
                c.height = Math.round(im.naturalHeight * k);
                c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
                URL.revokeObjectURL(url);
                const out = new Image();
                out.onload = () => resolve(out);
                out.src = c.toDataURL('image/jpeg', 0.92);
            };
            im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Não deu para abrir essa imagem.')); };
            im.src = url;
        });
    }

    // Gerador pseudoaleatório com semente, para o resultado não mudar a cada redesenho
    function rng(seed) {
        let s = seed >>> 0 || 1;
        return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
    }

    const LP = (lm, i, w, h) => ({ x: lm[i].x * w, y: lm[i].y * h });

    // Contornos dos olhos no mapa de 478 pontos do MediaPipe
    const EYE_L = [33, 7, 163, 144, 145, 153, 154, 155, 133, 173, 157, 158, 159, 160, 161, 246];
    const EYE_R = [362, 382, 381, 380, 374, 373, 390, 249, 263, 466, 388, 387, 386, 385, 384, 398];
    const IRIS_L = 468, IRIS_R = 473;
    // Parte de baixo do rosto (bochecha, buço e queixo) para a barba por fazer
    const BEARD = [234, 93, 132, 58, 172, 136, 150, 149, 176, 148, 152, 377, 400, 378, 379, 365, 397, 288, 361, 323, 454, 352, 411, 425, 266, 330, 327, 2, 98, 101, 36, 203, 187, 123];
    const LIPS = [61, 185, 40, 39, 37, 0, 267, 269, 270, 409, 291, 375, 321, 405, 314, 17, 84, 181, 91, 146];

    function polyPath(ctx, lm, idx, w, h) {
        ctx.beginPath();
        idx.forEach((i, k) => {
            const p = LP(lm, i, w, h);
            k ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
        });
        ctx.closePath();
    }

    /* ---------- Efeitos ---------- */
    function gradeAndVignette(ctx, w, h, dark) {
        // dessatura e puxa para o verde
        ctx.save();
        ctx.globalCompositeOperation = 'saturation';
        ctx.fillStyle = 'rgba(128,128,128,0.35)';
        ctx.fillRect(0, 0, w, h);
        ctx.globalCompositeOperation = 'multiply';
        ctx.fillStyle = `rgba(150, 190, 150, ${dark ? 0.9 : 0.6})`;
        ctx.fillRect(0, 0, w, h);
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = `rgba(4, 10, 6, ${dark ? 0.38 : 0.15})`;
        ctx.fillRect(0, 0, w, h);
        const v = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.3, w / 2, h / 2, Math.max(w, h) * 0.75);
        v.addColorStop(0, 'rgba(0,0,0,0)');
        v.addColorStop(1, `rgba(0,0,0,${dark ? 0.75 : 0.55})`);
        ctx.fillStyle = v;
        ctx.fillRect(0, 0, w, h);
        ctx.restore();
    }

    function fxSmoke(ctx, w, h, rand, origin, amount) {
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        const n = Math.round(amount);
        for (let i = 0; i < n; i++) {
            let x, y;
            if (origin && i < n * 0.55) {
                // coluna de fumaça subindo da brasa, abrindo e ondulando
                const t = i / (n * 0.55);
                x = origin.x + Math.sin(t * 7 + rand() * 2) * w * 0.05 * (0.4 + t) + (rand() - 0.5) * w * 0.03;
                y = origin.y - t * origin.y * 1.05;
            } else {
                x = rand() * w;
                y = rand() * h * 0.85;
            }
            const r = (0.04 + rand() * 0.10) * Math.min(w, h);
            const a = 0.08 + rand() * 0.12;
            const g = ctx.createRadialGradient(x, y, 0, x, y, r);
            g.addColorStop(0, `rgba(225, 235, 228, ${a})`);
            g.addColorStop(1, 'rgba(225, 235, 228, 0)');
            ctx.fillStyle = g;
            ctx.fillRect(x - r, y - r, r * 2, r * 2);
        }
        // névoa geral
        ctx.fillStyle = 'rgba(200, 215, 205, 0.06)';
        ctx.fillRect(0, 0, w, h);
        ctx.restore();
    }

    function drawSticker(ctx, name, x, y, size, angle) {
        const im = sticker[name];
        if (!im) return;
        const k = size / Math.max(im.width, im.height);
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.drawImage(im, -im.width * k / 2, -im.height * k / 2, im.width * k, im.height * k);
        ctx.restore();
    }

    // Baseado desenhado no canvas: piteira na boca (x, y), cone de papel e brasa na ponta
    function drawJoint(ctx, x, y, len, angle) {
        const im = sticker.baseado;
        if (im) {
            // Gira e escala a foto do baseado para a piteira cair em (x, y) e a brasa na direção do ângulo
            const ax = JOINT_FILTER.x * im.width, ay = JOINT_FILTER.y * im.height;
            const bx = JOINT_EMBER.x * im.width, by = JOINT_EMBER.y * im.height;
            const k = len / Math.hypot(bx - ax, by - ay);
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle - Math.atan2(by - ay, bx - ax));
            ctx.scale(k, k);
            ctx.shadowColor = 'rgba(0,0,0,0.35)';
            ctx.shadowBlur = 12 / k;
            ctx.drawImage(im, -ax, -ay);
            ctx.restore();
            // brilho da brasa
            const tx = x + Math.cos(angle) * len, ty = y + Math.sin(angle) * len;
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            const g = ctx.createRadialGradient(tx, ty, 0, tx, ty, len * 0.12);
            g.addColorStop(0, 'rgba(255, 120, 30, 0.55)');
            g.addColorStop(1, 'rgba(255, 60, 0, 0)');
            ctx.fillStyle = g;
            ctx.fillRect(tx - len * 0.12, ty - len * 0.12, len * 0.24, len * 0.24);
            ctx.restore();
            return;
        }
        // Sem a imagem: desenha um baseado simples
        const t0 = len * 0.045, t1 = len * 0.085; // espessura na boca e na ponta
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.shadowColor = 'rgba(0,0,0,0.35)';
        ctx.shadowBlur = len * 0.04;
        // papel
        const paper = ctx.createLinearGradient(0, -t1, 0, t1);
        paper.addColorStop(0, '#fbf6ea');
        paper.addColorStop(0.5, '#efe6d2');
        paper.addColorStop(1, '#c9bda3');
        ctx.fillStyle = paper;
        ctx.beginPath();
        ctx.moveTo(0, -t0);
        ctx.lineTo(len * 0.92, -t1);
        ctx.quadraticCurveTo(len * 0.97, 0, len * 0.92, t1);
        ctx.lineTo(0, t0);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
        // piteira
        ctx.fillStyle = '#d9b98a';
        ctx.fillRect(0, -t0, len * 0.16, t0 * 2);
        // cinza e brasa
        ctx.fillStyle = '#6b6b6b';
        ctx.beginPath();
        ctx.ellipse(len * 0.93, 0, len * 0.03, t1 * 0.95, 0, 0, Math.PI * 2);
        ctx.fill();
        const ember = ctx.createRadialGradient(len * 0.96, 0, 0, len * 0.96, 0, len * 0.12);
        ember.addColorStop(0, 'rgba(255, 220, 120, 1)');
        ember.addColorStop(0.25, 'rgba(255, 110, 20, 0.9)');
        ember.addColorStop(1, 'rgba(255, 60, 0, 0)');
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = ember;
        ctx.fillRect(len * 0.84, -len * 0.12, len * 0.24, len * 0.24);
        ctx.restore();
    }

    function faceEffects(ctx, w, h, lm, rand) {
        const faceW = Math.hypot(LP(lm, 454, w, h).x - LP(lm, 234, w, h).x, LP(lm, 454, w, h).y - LP(lm, 234, w, h).y);

        // Barba por fazer: pontinhos escuros na parte de baixo do rosto, sem cobrir a boca
        ctx.save();
        polyPath(ctx, lm, BEARD, w, h);
        ctx.clip();
        polyPath(ctx, lm, LIPS, w, h);
        ctx.globalCompositeOperation = 'source-over';
        const bb = BEARD.map(i => LP(lm, i, w, h));
        const minX = Math.min(...bb.map(p => p.x)), maxX = Math.max(...bb.map(p => p.x));
        const minY = Math.min(...bb.map(p => p.y)), maxY = Math.max(...bb.map(p => p.y));
        const lipsPath = new Path2D();
        LIPS.forEach((i, k) => { const p = LP(lm, i, w, h); k ? lipsPath.lineTo(p.x, p.y) : lipsPath.moveTo(p.x, p.y); });
        lipsPath.closePath();
        const dots = Math.round((maxX - minX) * (maxY - minY) / 9);
        for (let i = 0; i < dots; i++) {
            const x = minX + rand() * (maxX - minX), y = minY + rand() * (maxY - minY);
            if (ctx.isPointInPath(lipsPath, x, y)) continue;
            ctx.fillStyle = `rgba(30, 22, 18, ${0.18 + rand() * 0.3})`;
            const s = Math.max(1, faceW / 260);
            ctx.fillRect(x, y, s, s * (1 + rand()));
        }
        ctx.restore();

        // Olheiras
        for (const [eye, low] of [[EYE_L, 145], [EYE_R, 374]]) {
            const c = LP(lm, low, w, h);
            const r = faceW * 0.11;
            ctx.save();
            ctx.globalCompositeOperation = 'multiply';
            const g = ctx.createRadialGradient(c.x, c.y + r * 0.35, 0, c.x, c.y + r * 0.35, r);
            g.addColorStop(0, 'rgba(110, 70, 90, 0.55)');
            g.addColorStop(1, 'rgba(110, 70, 90, 0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.ellipse(c.x, c.y + r * 0.35, r, r * 0.55, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        // Olho vermelho: pinta o branco do olho, preservando a íris
        for (const [eye, iris] of [[EYE_L, IRIS_L], [EYE_R, IRIS_R]]) {
            ctx.save();
            polyPath(ctx, lm, eye, w, h);
            ctx.clip();
            const ic = lm[iris] ? LP(lm, iris, w, h) : null;
            const ir = faceW * 0.045;
            ctx.beginPath();
            ctx.rect(0, 0, w, h);
            if (ic) ctx.arc(ic.x, ic.y, ir, 0, Math.PI * 2, true);
            ctx.clip('evenodd');
            ctx.globalCompositeOperation = 'multiply';
            ctx.fillStyle = 'rgba(235, 60, 60, 0.75)';
            ctx.fillRect(0, 0, w, h);
            ctx.globalCompositeOperation = 'overlay';
            ctx.fillStyle = 'rgba(255, 40, 40, 0.35)';
            ctx.fillRect(0, 0, w, h);
            ctx.restore();
        }

        // Baseado no canto da boca
        const corner = LP(lm, 291, w, h), other = LP(lm, 61, w, h);
        const dir = Math.atan2(corner.y - other.y, corner.x - other.x);
        const len = faceW * 0.42;
        const angle = dir + 0.25;
        const start = { x: corner.x - Math.cos(angle) * len * 0.06, y: corner.y - Math.sin(angle) * len * 0.06 };
        drawJoint(ctx, start.x, start.y, len, angle);
        // ponta acesa (para a fumaça sair dali)
        return { x: start.x + Math.cos(angle) * len * 0.96, y: start.y + Math.sin(angle) * len * 0.96, faceW };
    }

    function sceneEffects(ctx, w, h, rand) {
        const base = Math.min(w, h);
        // um baseado aceso largado
        drawJoint(ctx, w * (0.45 + rand() * 0.15), h * 0.8, base * 0.28, -0.15 + (rand() - 0.5) * 0.3);
    }

    async function renderEffects() {
        const im = sourceImg;
        const w = im.naturalWidth, h = im.naturalHeight;
        fxCanvas.width = w;
        fxCanvas.height = h;
        const ctx = fxCanvas.getContext('2d');
        ctx.drawImage(im, 0, 0, w, h);

        await stickersReady;
        const landmarker = await getLandmarker();
        let faces = [];
        if (landmarker) {
            try { faces = landmarker.detect(im).faceLandmarks || []; } catch (e) { console.warn(e); }
        }
        hasFace = faces.length > 0;
        const rand = rng(w * 31 + h * 17);

        gradeAndVignette(ctx, w, h, !hasFace);
        if (hasFace) {
            let tip = null;
            for (const lm of faces) tip = faceEffects(ctx, w, h, lm, rand) || tip;
            fxSmoke(ctx, w, h, rand, tip, 90);
        } else {
            sceneEffects(ctx, w, h, rand);
            fxSmoke(ctx, w, h, rand, null, 90);
        }
    }


    /* ---------- Tony total (IA) ----------
       Servidor próprio na Cloudflare (pasta tonylooks-worker) com FLUX.2 klein 9B.
       Os textos do pedido ficam no servidor; aqui só vai a foto reduzida e o modo. */
    const TONY_API = "https://tonylooks.spooneta.workers.dev/api/tonyficar";

    // O modelo aceita foto de referência de até 512 px
    function referenceBlob() {
      return new Promise((resolve) => {
        const k = Math.min(1, 508 / Math.max(sourceImg.naturalWidth, sourceImg.naturalHeight));
        const c = document.createElement("canvas");
        c.width = Math.round(sourceImg.naturalWidth * k);
        c.height = Math.round(sourceImg.naturalHeight * k);
        c.getContext("2d").drawImage(sourceImg, 0, 0, c.width, c.height);
        c.toBlob(resolve, "image/jpeg", 0.92);
      });
    }

    async function generateAI() {
      aiBtn.disabled = true;
      aiError.hidden = true;
      aiStatus.hidden = false;
      aiStatus.textContent = "O Tony está se arrumando (para baixo)...";
      toke.on = false; mode = "inhale"; modeT = 0;
      try {
        const form = new FormData();
        form.append("image", await referenceBlob(), "foto.jpg");
        form.append("modo", hasFace ? "pessoa" : "cena");
        form.append("aspecto", String(sourceImg.naturalWidth / sourceImg.naturalHeight));
        const res = await fetch(TONY_API, { method: "POST", body: form });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.image) throw new Error(data.error || "A IA não respondeu agora. Tenta de novo daqui a pouco.");
        const bytes = Uint8Array.from(atob(data.image), (ch) => ch.charCodeAt(0));
        aiBlob = new Blob([bytes], { type: bytes[0] === 0x89 ? "image/png" : "image/jpeg" });
        aiImg.src = URL.createObjectURL(aiBlob);
        aiImg.hidden = false;
        aiEmpty.hidden = true;
        tonyExhale();
        sayLindao();
      } catch (e) {
        mode = "idle"; modeT = 0;
        const [mx, my] = mouthUv();
        splat(mx, my, rand(-200, 200), 260, [0.2, 0.26, 0.19], 0.2); // tosse
        squash.v += 4;
        aiError.textContent = e instanceof TypeError ? "Não deu para falar com a IA agora. Tenta de novo daqui a pouco." : e.message;
        aiError.hidden = false;
      } finally {
        aiStatus.hidden = true;
        aiBtn.disabled = false;
      }
    }
    aiBtn.addEventListener("click", generateAI);

    // ---------- Abas ----------
    function selectTab(t) {
      activeTab = t;
      tabFx.setAttribute("aria-selected", String(t === "fx"));
      tabAi.setAttribute("aria-selected", String(t === "ai"));
      panelFx.classList.toggle("show", t === "fx");
      panelAi.classList.toggle("show", t === "ai");
    }
    tabFx.addEventListener("click", () => selectTab("fx"));
    tabAi.addEventListener("click", () => selectTab("ai"));

    // ---------- Envio ----------
    async function handleFile(file) {
      if (!file || !file.type.startsWith("image/")) { err.textContent = "Escolha uma imagem."; return; }
      err.textContent = "";
      if (mode === "intro") endIntro();
      interacted = true; lastInput = performance.now(); wake(); sleeping = false;
      actx?.resume();
      try { sourceImg = await loadImage(file); } catch (e) { err.textContent = e.message; return; }
      // o Tony puxa a fumaça enquanto a foto é preparada
      toke.on = false; mode = "inhale"; modeT = 0;
      const minInhale = new Promise((r) => setTimeout(r, 1400));
      aiBlob = null; aiImg.hidden = true; aiEmpty.hidden = false; aiError.hidden = true;
      await Promise.all([renderEffects(), minInhale]);
      selectTab("fx");
      compose.hidden = true; result.hidden = false;
      compactTony(true);
      tonyExhale();
      sayLindao();
    }
    fileInput.addEventListener("change", () => handleFile(fileInput.files[0]));
    $("pickBtn").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); } });
    for (const el of [compose, document.body]) {
      el.addEventListener("dragover", (e) => e.preventDefault());
      el.addEventListener("drop", (e) => { e.preventDefault(); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
    }

    $("newBtn").addEventListener("click", () => {
      fileInput.value = "";
      result.hidden = true; compose.hidden = false;
      compactTony(false);
    });

    // ---------- Baixar e compartilhar ----------
    async function currentFile() {
      if (activeTab === "ai") {
        if (!aiBlob) return null;
        return new File([aiBlob], "tony-looks-ia." + (aiBlob.type.includes("png") ? "png" : "jpg"), { type: aiBlob.type });
      }
      const blob = await new Promise((r) => fxCanvas.toBlob(r, "image/jpeg", 0.9));
      return new File([blob], "tony-looks.jpg", { type: "image/jpeg" });
    }
    function downloadFile(file) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(file);
      a.download = file.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }
    $("downloadBtn").addEventListener("click", async () => {
      const f = await currentFile();
      if (!f) { toast("Gere o Tony total primeiro."); return; }
      downloadFile(f);
    });
    // Celular: menu de compartilhar com a foto (o WhatsApp aparece na lista).
    // Computador: baixa a foto e abre o WhatsApp Web para anexar.
    $("zapBtn").addEventListener("click", async () => {
      const f = await currentFile();
      if (!f) { toast("Gere o Tony total primeiro."); return; }
      if (navigator.canShare?.({ files: [f] })) {
        try { await navigator.share({ files: [f], title: "Tony Looks" }); }
        catch (e) { if (e.name !== "AbortError") toast("Não deu para compartilhar."); }
        return;
      }
      downloadFile(f);
      toast("Foto baixada! Anexa ela na conversa do WhatsApp.");
      window.open("https://web.whatsapp.com/", "_blank", "noopener");
    });

    // Botão do topo: manda o link do site no Zap
    const SITE_URL = "https://spooneta.github.io/tonylooks/";
    $("share-top").addEventListener("click", () => {
      const msg = `Tony Looks: manda sua foto e vira um Tony\n${SITE_URL}`;
      window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, "_blank", "noopener");
    });

  </script>
